version: "2"

run:
  timeout: 3m
  tests: true
  concurrency: 4
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    # ---- 基础质量保证 ----
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    # - gosimple
    - revive
    # - gofumpt

    # ---- 复杂度、结构与风格 ----
    - goconst
    - gocyclo
    - unconvert
    - unparam
    - nakedret

    # ---- 可靠性 & 防 Bug ----
    - rowserrcheck
    - sqlclosecheck
    - noctx

    # ---- 性能建议（中等力度） ----
    - prealloc

    # ---- 规范、拼写、安全 ----
    # - gci
    - misspell
    - gosec

linters-settings:

  gocyclo:
    min-complexity: 15

  revive:
    severity: warning
    rules:
      - name: indent-error-flow
      - name: early-return
      - name: errorf
      - name: exported
      - name: var-naming
      - name: receiver-naming
      - name: unreachable-code

  gofumpt:
    extra-rules: true

  gci:
    sections:
      - Standard
      - Default
      - Prefix(github.com/your-org)   # ← 根据你的 module 替换
    skip-generated: true

  prealloc:
    simple: true
    range-loops: true

  misspell:
    locale: US

issues:
  exclude-use-default: false

  exclude-rules:
    # 测试文件更宽松
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocyclo

    # misspell 误报过滤
    - linters:
        - misspell
      text: "error"

    # prealloc 噪音过滤
    - linters:
        - prealloc
      text: "make"

  # 忽略 vendor 目录
  exclude-dirs:
    - vendor

output:
  sort-results: true
